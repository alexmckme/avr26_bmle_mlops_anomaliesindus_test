# Orchestration locale de la stack MLOps « Anomalies Indus ».
#
#   minio   : object store S3 (images MVTec + artefacts MLflow)
#   mlflow  : serveur de tracking + Model Registry (backend SQLite, artefacts MinIO)
#   api     : FastAPI (/training, /predict, /models, /runs, /metrics)
#   streamlit : interface de démonstration (client HTTP de l'api)
#   airflow : orchestration du ré-entraînement (profil « airflow », voir plus bas)
#   prometheus + grafana : monitoring (profil « monitoring », voir plus bas)
#
# Démarrage :  docker compose up -d --build
# + Airflow :  docker compose --profile airflow up -d      (UI : http://localhost:8080)
# + Monitoring : docker compose --profile monitoring up -d  (Grafana : http://localhost:3000)
# Arrêt     :  docker compose down
# Logs      :  docker compose logs -f api
#
# Les identifiants sont repris du fichier .env (MINIO_ACCESS_KEY / MINIO_SECRET_KEY).
# NOTE : arrêter le MinIO *natif* avant (./stop_minio.sh) : mêmes ports et mêmes données.
name: anomalies-indus

services:
  # ── Object store S3 (données + artefacts) ──────────────────
  minio:
    # MinIO est publié sur Quay.io (le repo Docker Hub n'existe plus).
    # Version AGPL de 2025 (les builds 2026 exigent une licence).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9100:9000" # API S3   (hôte 9100 car 9000 occupé par Jupyter)
      - "9200:9001" # Console  -> http://localhost:9200
    volumes:
      - ./minio-data:/data # réutilise les données du MinIO natif
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MLflow : tracking + registry ───────────────────────────
  mlflow:
    build: ./docker/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5050,127.0.0.1,127.0.0.1:5050
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "5050:5000" # UI -> http://localhost:5050 (5000 est pris par AirPlay sur macOS)
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db # réutilise l'historique de runs existant
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── API d'inférence / entraînement ─────────────────────────
  api:
    build: .
    environment:
      # MinIO (réseau interne Docker : nom de service + port conteneur)
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-mvtec-ad}
      DATASET_DIR: dataset/raw
      # MLflow (serveur) + accès direct à MinIO pour les artefacts
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-anomalies-indus}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET:-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "8000:8000" # docs -> http://localhost:8000/docs
    volumes:
      - ./models:/app/models # cache local du modèle champion
      - ./dataset/raw:/app/dataset/raw:ro # utile pour --source local / ingestion
      # Versioning : le conteneur lit le .git de l'hôte (lecture seule) pour
      # estampiller le commit du code dans chaque run MLflow (core/versioning.py).
      # Pas de binaire git dans l'image : le module lit .git/HEAD directement.
      - ./.git:/app/.git:ro
      # Index des jeux de données : DOIT être un FICHIER (touch par setup_env.sh),
      # sinon Docker crée un dossier au niveau du bind mount.
      - ./datasets.json:/app/datasets.json
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  # ── Interface de démonstration (Streamlit) ─────────────────
  # Client HTTP de l'API : aucune logique ML ici, donc image légère (sans
  # TensorFlow) et démarrage en quelques secondes.
  #   UI : http://localhost:8501
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    environment:
      # Appels du conteneur vers l'API (réseau interne Docker)
      API_BASE_URL: http://api:8000
      DATASET_DIR: dataset/raw # jeu de test local affiché dans l'UI
      # Vérifications d'état faites depuis le conteneur (réseau interne)
      PROMETHEUS_URL: http://prometheus:9090
      MLFLOW_INTERNAL_URL: http://mlflow:5000
      AIRFLOW_INTERNAL_URL: http://airflow:8080
      # Liens affichés à l'utilisateur (ouverts depuis son navigateur)
      MLFLOW_URL: http://localhost:5050
      GRAFANA_URL: http://localhost:3000
      AIRFLOW_URL: http://localhost:8080
      MINIO_CONSOLE_URL: http://localhost:9200
      API_DOCS_URL: http://localhost:8000/docs
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app/streamlit_app:ro # édition à chaud, sans rebuild
      - ./dataset/raw:/app/dataset/raw:ro # images du jeu de test
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── Orchestration (profil « airflow ») ─────────────────────
  # Démonstration d'automatisation : le DAG `training_pipeline` appelle
  # POST /training à intervalle régulier (défaut : toutes les minutes).
  # Volontairement un seul conteneur (`airflow standalone` = metadata DB SQLite +
  # scheduler + webserver) et aucune dépendance ML : Airflow orchestre, l'API exécute.
  #
  #   docker compose --profile airflow up -d
  #   UI : http://localhost:8080   (admin / admin)
  airflow:
    image: apache/airflow:2.10.5-python3.12 # 2.x : Airflow 3 ne supporte plus SQLite
    profiles: ["airflow"] # n'alourdit pas `docker compose up -d` par défaut
    # `standalone` = metadata DB + scheduler + webserver dans un seul conteneur.
    #  - `rm -f *.pid` : les pid files du volume survivent à la recréation du conteneur,
    #    et Airflow refuse alors de démarrer son webserver (« Already running on PID… »).
    #  - compte admin (re)fixé : sinon Airflow génère un mot de passe aléatoire à
    #    récupérer dans les logs, peu pratique en démo.
    # NB : commande sur UNE seule ligne (`;` et non retours à la ligne dans `bash -c`).
    command: 'bash -c "rm -f /opt/airflow/*.pid; airflow db migrate; airflow users reset-password --username admin --password admin || airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com; exec airflow standalone"'
    environment:
      # — comportement Airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # pas les ~60 DAGs d'exemple
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false" # le DAG démarre actif
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor # suffisant pour la démo
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: anomalies-indus-demo # sessions stables
      PYTHONDONTWRITEBYTECODE: "1" # pas de __pycache__ dans les DAGs montés
      # — réglages lus par le DAG (airflow/dags/training_pipeline.py)
      API_BASE_URL: http://api:8000 # nom de service Docker
      TRAINING_SCHEDULE: "${TRAINING_SCHEDULE:-* * * * *}"
    ports:
      - "8080:8080" # UI -> http://localhost:8080
    volumes:
      - ./airflow/dags:/opt/airflow/dags # les DAGs restent du code versionné
      - airflow-home:/opt/airflow # metadata DB + logs, persistants entre `down`
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── Monitoring (profil « monitoring ») ─────────────────────
  # Prometheus *scrape* `/metrics` de l'API (modèle « pull ») et Grafana l'affiche.
  # Rien à configurer à la main : datasource, dashboard et alertes sont provisionnés
  # depuis ./monitoring (configuration versionnée dans le repo).
  #
  #   docker compose --profile monitoring up -d
  #   Grafana    : http://localhost:3000   (admin/admin, ou accès anonyme en lecture)
  #   Prometheus : http://localhost:9090   (onglets Targets / Alerts pour debugger)
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d # rétention des séries temporelles
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro # prometheus.yml + alerts.yml
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    environment:
      # Démo : accès anonyme en lecture, pour que personne n'ait à se connecter
      # devant la soutenance (l'édition reste protégée par admin/admin).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      # On monte les deux sous-dossiers utilisés (et pas tout `provisioning/`) :
      # `plugins/` et `alerting/` de l'image restent en place, ce qui évite des
      # erreurs de provisioning « no such file or directory » au démarrage.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  airflow-home:
  prometheus-data:
  grafana-data:
